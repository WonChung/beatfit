name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: beatfit
          POSTGRES_USER: beatfit
          POSTGRES_PASSWORD: beatfit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beatfit -d beatfit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://beatfit:beatfit_ci@127.0.0.1:5432/beatfit
      TEST_DATABASE_URL: postgresql+psycopg://beatfit:beatfit_ci@127.0.0.1:5432/beatfit_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create isolated test database
        run: docker exec "${{ job.services.postgres.id }}" createdb --username beatfit beatfit_test

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check backend dependency consistency
        run: python -m pip check

      - name: Audit backend dependencies
        run: pip-audit -r requirements.txt

      - name: Check backend lint
        run: ruff check app tests migrations

      - name: Check backend formatting
        run: ruff format --check app tests migrations

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify current database revision
        run: alembic current

      - name: Check for migration drift
        run: alembic check

      - name: Run backend tests against PostgreSQL
        run: pytest -q

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Audit mobile dependencies
        run: npm audit --audit-level=high

      - name: Run mobile lint
        run: npm run lint

      - name: Run mobile TypeScript checks
        run: npm run typecheck

      - name: Run mobile tests
        run: npm test

      - name: Verify Apple Music native-module autolinking
        run: npm run verify:native-module

      - name: Export iOS application bundle
        run: npm run export:ios

  web:
    name: Web
    runs-on: ubuntu-latest
    # Build-only public values exercise production validation without granting
    # access to an application environment or external account.
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.ci-build.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Audit web dependencies
        run: npm audit --audit-level=high

      - name: Run web lint
        run: npm run lint

      - name: Run web TypeScript checks
        run: npm run typecheck

      - name: Run web tests
        run: npm test

      - name: Build web application
        run: npm run build
