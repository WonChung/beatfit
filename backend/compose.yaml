services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: beatfit
      POSTGRES_USER: beatfit
      POSTGRES_PASSWORD: beatfit_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beatfit -d beatfit"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - beatfit_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  beatfit_postgres_data:
